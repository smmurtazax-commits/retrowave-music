name: Sync RetroWave project

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Sync project from zip
        run: |
          set -e
          mkdir -p /tmp/extract
          unzip -o retrowave-music-project.zip -d /tmp/extract
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/extract/./ ./
          rm -f retrowave-music-project.zip
          rm -f .github/workflows/sync-retrowave.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync RetroWave project (build 14)"
          git push
