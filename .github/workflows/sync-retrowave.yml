name: Sync RetroWave Project

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Sync project from zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/extract
          unzip -o retrowave-music-project.zip -d /tmp/extract
          # Delete everything except .git and .github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          # Sync from the extraction root itself (its contents, never a subdirectory inside it)
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/extract/./ ./
          rm -f retrowave-music-project.zip
          # Delete this workflow file itself
          rm -f .github/workflows/sync-retrowave.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync RetroWave project (build 15)" || echo "No changes to commit"
          git push
