name: Update project from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and sync into repo root
        run: |
          mkdir -p /tmp/extract
          unzip -o retrowave-music-project.zip -d /tmp/extract
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/extract/ ./
          rm -f retrowave-music-project.zip
      - name: Commit synced project
        run: |
          git config user.name "smmurtazax-commits"
          git config user.email "smmurtazax-commits@users.noreply.github.com"
          git add -A
          git commit -m "Update project from retrowave-music-project.zip (build #12 PLAYBACK RESCUE)" || echo "No changes to commit"
          git push
      - name: Delete this workflow file
        run: |
          rm -f .github/workflows/update-from-zip.yml
          git add -A
          git commit -m "Remove temporary update workflow" || echo "No changes to commit"
          git push
