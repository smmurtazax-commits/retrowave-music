name: Update project from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          set -e
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -o retrowave-music-project.zip -d /tmp/project
          SRC=/tmp/project
          if [ ! -f "$SRC/pubspec.yaml" ]; then
            SUBDIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d)
            COUNT=$(echo "$SUBDIRS" | grep -c . || true)
            if [ "$COUNT" = "1" ]; then
              SRC="$SUBDIRS"
            fi
          fi
          echo "Extracting from $SRC"
          ls "$SRC"
          rsync -a --delete --exclude='.git' --exclude='.github' "$SRC"/ ./
      - name: Commit updated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update project from retrowave-music-project.zip (build #10)"
            git push
          fi
      - name: Remove temporary zip and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f retrowave-music-project.zip .github/workflows/update-from-zip.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "Remove temporary update zip and workflow"
            git push
          fi
