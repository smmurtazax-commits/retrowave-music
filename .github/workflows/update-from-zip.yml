name: Update project from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and sync into repo root
        run: |
          unzip -o retrowave-music-project.zip -d /tmp/extracted
          ls -la /tmp/extracted
          EXTRACTED=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$EXTRACTED" ]; then EXTRACTED=/tmp/extracted; fi
          echo "Extracted dir: $EXTRACTED"
          ls -la "$EXTRACTED"
          rsync -a --delete --exclude='.git' --exclude='.github' "$EXTRACTED"/ ./
          rm -f retrowave-music-project.zip
      - name: Commit updated project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "Update project from retrowave-music-project.zip (build #11 playback fix)" || echo "No changes to commit"
          git push
      - name: Delete this workflow file
        run: |
          rm -f .github/workflows/update-from-zip.yml
          git add -A
          git commit -m "Remove temporary update-from-zip workflow" || echo "No changes to commit"
          git push
