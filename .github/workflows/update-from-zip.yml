name: Update project from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project zip (excluding .github)
        run: |
          unzip -o retrowave-music-project.zip -x '*/.github/*' '.github/*'
          ls -la
      - name: Commit and push extracted project
        run: |
          rm -f retrowave-music-project.zip
          rm -f .github/workflows/update-from-zip.yml
          git config user.name "smmurtazax-commits"
          git config user.email "smmurtazax-commits@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Update project from retrowave-music-project.zip" || echo "No changes to commit"
          git push
