name: Update project from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project zip into repository root
        run: |
          set -e
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o retrowave-music-project.zip -d /tmp/extracted
          SRC=/tmp/extracted
          COUNT=$(find "$SRC" -mindepth 1 -maxdepth 1 | wc -l)
          ONLY=$(find "$SRC" -mindepth 1 -maxdepth 1)
          if [ "$COUNT" = "1" ] && [ -d "$ONLY" ]; then
            SRC="$ONLY"
          fi
          rsync -a --delete --exclude='.github' --exclude='retrowave-music-project.zip' "$SRC"/ ./
      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project from retrowave-music-project.zip" || echo "Nothing to commit"
          git push
      - name: Remove zip and workflow file
        run: |
          rm -f retrowave-music-project.zip .github/workflows/update-from-zip.yml
          git add -A
          git commit -m "Remove temporary update zip and workflow" || echo "Nothing to commit"
          git push
