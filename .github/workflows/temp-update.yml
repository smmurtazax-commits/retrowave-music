name: Temporary project update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and update repo
        run: |
          set -e
          unzip -o retrowave-music-project.zip -x ".github/*" "*/.github/*" "__MACOSX/*"
          for d in */; do
            if [ -f "${d}pubspec.yaml" ]; then
              echo "Moving contents of $d to repo root"
              shopt -s dotglob
              mv "${d}"* .
              rmdir "$d" || true
            fi
          done
          rm -f retrowave-music-project.zip
          rm -f .github/workflows/temp-update.yml
          git config user.name "smmurtazax-commits"
          git config user.email "smmurtazax-commits@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update project from retrowave-music-project.zip"
          git push
