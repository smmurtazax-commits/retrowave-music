workflows:
  android-release:
    name: RetroWave Music - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - sm.murtazax@gmail.com
        notify:
          success: true
          failure: true
