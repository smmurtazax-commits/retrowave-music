name: retrowave_music
description: RetroWave Music — a retro-styled music player for the music stored on your phone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.14
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
